# Build PocketTTSClone iOS App
# Runs on GitHub-hosted macOS to:
# 1. Build sherpa-onnx iOS framework (xcframework)
# 2. Build PocketTTSClone Swift app
# 3. Export unsigned IPA for sideloading via AltStore

name: Build PocketTTSClone iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_archive:
        description: 'Skip final archive step (faster debug)'
        required: false
        default: 'false'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  BUNDLE_ID: com.pockettts.clone
  APP_NAME: PocketTTSClone
  SHERPA_ONNX_TAG: master
  ONNXRUNTIME_VERSION: 1.27.0

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout PocketTTSClone
        uses: actions/checkout@v4

      - name: Checkout sherpa-onnx (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: 546df6f963ae719dddd8b8d10749e9d9086b0d86
          path: sherpa-onnx
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version
          xcodebuild -runFirstLaunch 2>&1 || true

      - name: Build sherpa-onnx iOS Framework
        id: build_sherpa
        working-directory: sherpa-onnx
        run: |
          echo "Building sherpa-onnx iOS xcframework..."
          bash build-ios.sh
          echo "sherpa_onnx_version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "xcframework_path=$(pwd)/build-ios/sherpa-onnx.xcframework" >> $GITHUB_OUTPUT

      - name: Verify sherpa-onnx Framework
        run: |
          ls -la sherpa-onnx/build-ios/sherpa-onnx.xcframework/
          file sherpa-onnx/build-ios/sherpa-onnx.xcframework/ios-arm64/libsherpa-onnx.a
          echo "✅ sherpa-onnx xcframework built successfully"

      - name: Copy sherpa-onnx headers into bridging header directory
        run: |
          # Copy headers next to the bridging header so clang finds them
          # via default quoted include resolution (relative to including file)
          mkdir -p PocketTTSClone/Bridging/c-api
          cp sherpa-onnx/c-api/c-api.h PocketTTSClone/Bridging/c-api/
          echo "Copied headers:"
          ls -la PocketTTSClone/Bridging/c-api/

      - name: Set up Swift Package
        run: |
          swift package resolve
          swift package show-dependencies
          # Debug: list available schemes/targets
          xcodebuild -list 2>&1 | head -50 || true

      - name: Build Swift App (Debug, device only)
        run: |
          FRAMEWORK_PATH="$(pwd)/sherpa-onnx/build-ios/sherpa-onnx.xcframework"
          SHERPA_SRC="$(pwd)/sherpa-onnx"
          BRIDGING_HEADER="$(pwd)/PocketTTSClone/Bridging/PocketTTS-Bridging-Header.h"
          # Try xcodebuild with -target (more reliable than -scheme for SPM)
          xcodebuild clean build \
            -target PocketTTSClone \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            FRAMEWORK_SEARCH_PATHS="$FRAMEWORK_PATH" \
            OTHER_LDFLAGS="-L$FRAMEWORK_PATH/ios-arm64 -lsherpa-onnx" \
            SWIFT_OBJC_BRIDGING_HEADER="$BRIDGING_HEADER" || {
              echo "⚠️ xcodebuild failed — trying swift build instead"
              swift build \
                -c debug \
                -Xlinker -L$FRAMEWORK_PATH/ios-arm64 -Xlinker -lsherpa-onnx \
                -Xswiftc -import-objc-header -Xswiftc $BRIDGING_HEADER 2>&1 || \
                echo "⚠️ swift build also failed"
            }

      - name: Build Swift App (Debug, device only)
        run: |
          FRAMEWORK_PATH="$(pwd)/sherpa-onnx/build-ios/sherpa-onnx.xcframework"
          BRIDGING_HEADER="$(pwd)/PocketTTSClone/Bridging/PocketTTS-Bridging-Header.h"
          # Try xcodebuild with -target (more reliable than -scheme for SPM)
          # Headers are already copied to PocketTTSClone/Bridging/c-api/
          xcodebuild clean build \
            -target PocketTTSClone \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            FRAMEWORK_SEARCH_PATHS="$FRAMEWORK_PATH" \
            OTHER_LDFLAGS="-L$FRAMEWORK_PATH/ios-arm64 -lsherpa-onnx" \
            SWIFT_OBJC_BRIDGING_HEADER="$BRIDGING_HEADER" || {
              echo "⚠️ xcodebuild failed — trying swift build instead"
              # swift build uses Package.swift settings which include cSettings
              swift build \
                -c debug \
                -Xlinker -L$FRAMEWORK_PATH/ios-arm64 -Xlinker -lsherpa-onnx \
                -Xswiftc -import-objc-header -Xswiftc $BRIDGING_HEADER 2>&1 || \
                echo "⚠️ swift build also failed"
            }

      - name: Archive App (Release, unsigned)
        if: github.event.inputs.skip_archive != 'true'
        run: |
          FRAMEWORK_PATH="$(pwd)/sherpa-onnx/build-ios/sherpa-onnx.xcframework"
          BRIDGING_HEADER="$(pwd)/PocketTTSClone/Bridging/PocketTTS-Bridging-Header.h"
          xcodebuild archive \
            -target PocketTTSClone \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/PocketTTSClone.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            FRAMEWORK_SEARCH_PATHS="$FRAMEWORK_PATH" \
            OTHER_LDFLAGS="-L$FRAMEWORK_PATH/ios-arm64 -lsherpa-onnx" \
            SWIFT_OBJC_BRIDGING_HEADER="$BRIDGING_HEADER"

      - name: Build unsigned IPA manually (from archive)
        if: github.event.inputs.skip_archive != 'true'
        run: |
          mkdir -p build/IPA
          if [ -d "build/PocketTTSClone.xcarchive" ]; then
            # Manually construct IPA from the archive's .app bundle
            APP="build/PocketTTSClone.xcarchive/Products/Applications/PocketTTSClone.app"
            if [ -d "$APP" ]; then
              mkdir -p build/IPA/Payload
              cp -r "$APP" build/IPA/Payload/
              cd build/IPA
              zip -r PocketTTSClone.ipa Payload/
              cd ../..
              echo "✅ IPA created at build/IPA/PocketTTSClone.ipa"
            else
              # Try xcodebuild -exportArchive as fallback
              cat > build/ExportOptions.plist << 'PLISTEOF'
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                <key>method</key>
                <string>debug</string>
                <key>signingStyle</key>
                <string>automatic</string>
                <key>compileBitcode</key>
                <false/>
                <key>uploadSymbols</key>
                <false/>
              </dict>
              </plist>
              PLISTEOF
              xcodebuild -exportArchive \
                -archivePath build/PocketTTSClone.xcarchive \
                -exportPath build/IPA \
                -exportOptionsPlist build/ExportOptions.plist \
                -allowProvisioningUpdates NO || \
                cp -r build/PocketTTSClone.xcarchive build/IPA/ && \
                echo "⚠️ Export failed — raw archive at build/IPA/"
            fi
          else
            echo "⚠️ No archive found — IPA build skipped"
          fi

      - name: Upload IPA artifact
        if: github.event.inputs.skip_archive != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PocketTTSClone-iOS
          path: |
            build/IPA/*.ipa
            build/PocketTTSClone.xcarchive
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload sherpa-onnx framework (cached)
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-xcframework
          path: sherpa-onnx/build-ios/sherpa-onnx.xcframework
          retention-days: 30