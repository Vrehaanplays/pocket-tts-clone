# Build PocketTTSClone iOS App
# Builds sherpa-onnx framework, compiles Swift app, exports unsigned IPA
# for sideloading via AltStore

name: Build PocketTTSClone iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_archive:
        description: 'Skip final archive step (faster debug)'
        required: false
        default: 'false'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  BUNDLE_ID: com.pockettts.clone
  APP_NAME: PocketTTSClone
  SHERPA_ONNX_TAG: master
  ONNXRUNTIME_VERSION: 1.27.0

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout PocketTTSClone
        uses: actions/checkout@v4

      - name: Checkout sherpa-onnx (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: k2-fsa/sherpa-onnx
          ref: 546df6f963ae719dddd8b8d10749e9d9086b0d86
          path: sherpa-onnx
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version
          xcodebuild -runFirstLaunch 2>&1 || true

      - name: Build sherpa-onnx iOS Framework
        working-directory: sherpa-onnx
        run: |
          echo "Building sherpa-onnx iOS xcframework..."
          bash build-ios.sh
          echo "[OK] sherpa-onnx xcframework built"

      - name: Copy headers next to bridging header
        run: |
          # Copy sherpa-onnx C API headers alongside bridging header so
          # clang finds them via default quoted-include resolution
          mkdir -p PocketTTSClone/Bridging/c-api
          # The sherpa-onnx repo source tree is at sherpa-onnx/sherpa-onnx/
          SHERPA_SRC="$(pwd)/sherpa-onnx/sherpa-onnx"
          if [ -f "$SHERPA_SRC/c-api/c-api.h" ]; then
            echo "Using known path: $SHERPA_SRC/c-api/c-api.h"
            cp "$SHERPA_SRC/c-api/c-api.h" PocketTTSClone/Bridging/c-api/
          else
            # Fallback: exclude harmony-os, find the real c-api
            SHERPA_HEADER=$(find sherpa-onnx -name "c-api.h" -path "*/sherpa-onnx/c-api/*" ! -path "*/harmony-os/*" 2>/dev/null | head -1)
            if [ -n "$SHERPA_HEADER" ]; then
              echo "Found via fallback: $SHERPA_HEADER"
              cp "$SHERPA_HEADER" PocketTTSClone/Bridging/c-api/
            else
              echo "[ERROR] Could not find c-api.h in sherpa-onnx checkout"
              find sherpa-onnx -name "c-api.h" 2>/dev/null
              exit 1
            fi
          fi
          ls -la PocketTTSClone/Bridging/c-api/

      - name: "Debug: verify header location"
        run: |
          ls -la PocketTTSClone/Bridging/c-api/

      - name: Resolve Swift Package dependencies
        run: |
          swift package resolve

      - name: Build Swift App (Debug, device only)
        run: |
          FRAMEWORK_PATH="$(pwd)/sherpa-onnx/build-ios/sherpa-onnx.xcframework"
          BRIDGING_HEADER="$(pwd)/PocketTTSClone/Bridging/PocketTTS-Bridging-Header.h"
          IOS_TARGET="arm64-apple-ios17.0"
          FRAMEWORK_DIR="$(dirname "$FRAMEWORK_PATH")"
          # Try xcodebuild with scheme (SPM-based project, no .xcodeproj)
          xcodebuild clean build \
            -scheme PocketTTSClone \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            FRAMEWORK_SEARCH_PATHS="$FRAMEWORK_DIR" \
            OTHER_LDFLAGS="-L$FRAMEWORK_PATH/ios-arm64 -lsherpa-onnx" \
            SWIFT_OBJC_BRIDGING_HEADER="$BRIDGING_HEADER" || {
              echo "[WARN] xcodebuild failed -- trying swift build for iOS"
              swift build \
                -c debug \
                -Xswiftc -target -Xswiftc $IOS_TARGET \
                -Xlinker -L$FRAMEWORK_PATH/ios-arm64 -Xlinker -lsherpa-onnx \
                -Xswiftc -import-objc-header -Xswiftc $BRIDGING_HEADER 2>&1 || \
                echo "[WARN] swift build also failed"
            }

      - name: "Build Release and create IPA"
        if: github.event.inputs.skip_archive != 'true'
        run: |
          FRAMEWORK_PATH="$(pwd)/sherpa-onnx/build-ios/sherpa-onnx.xcframework"
          BRIDGING_HEADER="$(pwd)/PocketTTSClone/Bridging/PocketTTS-Bridging-Header.h"
          FRAMEWORK_DIR="$(dirname "$FRAMEWORK_PATH")"
          DD="build/DerivedData"

          echo "--- Building Release with xcodebuild ---"
          xcodebuild build \
            -scheme PocketTTSClone \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$DD" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            FRAMEWORK_SEARCH_PATHS="$FRAMEWORK_DIR" \
            OTHER_LDFLAGS="-L$FRAMEWORK_PATH/ios-arm64 -lsherpa-onnx" \
            SWIFT_OBJC_BRIDGING_HEADER="$BRIDGING_HEADER"

          if [ $? -ne 0 ]; then
            echo "[ERROR] xcodebuild build failed"
            exit 1
          fi

          echo "--- Finding built product for IPA ---"
          mkdir -p build/IPA

          # Search broadly in DerivedData for .app bundles or PocketTTSClone executables
          APP_PATH=$(find "$DD" -name "PocketTTSClone.app" -type d 2>/dev/null | head -1)
          EXEC_PATH=$(find "$DD" -name "PocketTTSClone" -type f ! -name "*.swift" ! -path "*/SourcePackages/*" 2>/dev/null | head -1)

          if [ -n "$APP_PATH" ]; then
            echo "Found .app bundle at: $APP_PATH"
            mkdir -p build/IPA/Payload
            cp -r "$APP_PATH" build/IPA/Payload/PocketTTSClone.app
            cd build/IPA && zip -r PocketTTSClone.ipa Payload/ && cd ../..
            echo "[OK] IPA created at build/IPA/PocketTTSClone.ipa"
          elif [ -n "$EXEC_PATH" ]; then
            echo "Found executable at: $EXEC_PATH — creating minimal .app bundle"
            mkdir -p build/IPA/Payload/PocketTTSClone.app
            cp "$EXEC_PATH" "build/IPA/Payload/PocketTTSClone.app/PocketTTSClone"
            if [ -f "PocketTTSClone/Info.plist" ]; then
              cp "PocketTTSClone/Info.plist" "build/IPA/Payload/PocketTTSClone.app/"
            fi
            cd build/IPA && zip -r PocketTTSClone.ipa Payload/ && cd ../..
            echo "[OK] Minimal IPA created at build/IPA/PocketTTSClone.ipa"
          else
            echo "[WARN] No .app or executable found anywhere in $DD"
            echo "--- Debug: searching DerivedData structure ---"
            ls -la "$DD" 2>/dev/null
            find "$DD" -name "PocketTTSClone*" -type f 2>/dev/null | head -10
            find "$DD" -name "*.app" -type d 2>/dev/null | head -5
            find "$DD/Build" -maxdepth 4 -type d 2>/dev/null | head -20
          fi

      - name: Upload IPA artifact
        if: github.event.inputs.skip_archive != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PocketTTSClone-iOS
          path: build/IPA/*.ipa
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload sherpa-onnx framework (cached)
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-xcframework
          path: sherpa-onnx/build-ios/sherpa-onnx.xcframework
          retention-days: 30
